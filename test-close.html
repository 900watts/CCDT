<!doctype html>
<html><head><meta charset="utf-8"><title>WinBox close test</title>
<link rel="stylesheet" href="/node_modules/winbox/dist/css/winbox.min.css">
</head><body style="background:#05080a;color:#fff;font-family:monospace;padding:20px">

<button id="open" style="padding:8px 16px;background:#38ff9a;color:#000;border:none;cursor:pointer">Open Mailbox</button>
<p id="status">Closed</p>

<script type="module">
import WinBox from '/node_modules/winbox/src/js/winbox.js'

function focusIfExists(key) { return false }
function nextZIndex() { return 10001 }
function registerWindow(key, wb) {
  console.log('register', key)
}

document.getElementById('open').onclick = () => {
  const wb = new WinBox({
    title: 'TEST MAILBOX',
    class: 'ccdt-win ccdt-win--mail',
    html: '<div style="padding:20px;color:#fff">Hello</div>',
    background: '#05080a',
    x: 'center', y: 'center',
    width: '600px', height: '400px',
    index: nextZIndex(),
    onclose: () => {
      console.log('onclose called')
      return true
    }
  })
  registerWindow('mail:inbox', wb)
  document.getElementById('status').textContent = 'Open. Click X to close.'
}
</script>
</body></html>
